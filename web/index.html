<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d5bd1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Вендинг">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Вендинг</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: configurable stack of blocks; main block = machine list (left) + selected machine's day (right), stacks on phones. Same identity as the planogram editor. */
:root{
  --bg:#eaeef2; --surface:#ffffff; --surface-2:#f4f6f9; --ink:#15202b; --muted:#5b6978; --line:#d3dae2;
  --accent:#1d5bd1; --accent-ink:#ffffff; --accent-soft:#e3ebfb; --bar:#9db7ea; --bar-today:#1d5bd1;
  --ok:#1d7a4a; --warn:#a85a07; --bad:#b42318; --warn-soft:#fdf0e1; --bad-soft:#fde8e6;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#171f28; --surface-2:#1d2732; --ink:#e6ecf2; --muted:#93a1b1; --line:#2b3644;
  --accent:#6f9cff; --accent-ink:#0b1220; --accent-soft:#1c2a45; --bar:#34507f; --bar-today:#6f9cff;
  --ok:#5fd19a; --warn:#f0a85a; --bad:#ff8a7d; --warn-soft:#33240f; --bad-soft:#3a1915; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#171f28; --surface-2:#1d2732; --ink:#e6ecf2; --muted:#93a1b1; --line:#2b3644;
  --accent:#6f9cff; --accent-ink:#0b1220; --accent-soft:#1c2a45; --bar:#34507f; --bar-today:#6f9cff;
  --ok:#5fd19a; --warn:#f0a85a; --bad:#ff8a7d; --warn-soft:#33240f; --bad-soft:#3a1915; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(20px,3.4vw,28px);margin:2px 0 0;letter-spacing:-.01em}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 8px;flex-wrap:wrap}
.ph h2{font-size:15px;margin:0;font-weight:700}
.ph small{color:var(--muted);font-size:12.5px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs{display:flex;width:100%}
.tabs button{flex:1 1 0;padding:7px 4px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

/* summary */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.sum > div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.sum .l{font-size:12.5px;color:var(--muted);font-weight:600}
.sum .v{font-family:var(--mono);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sum .s{font-size:12.5px;color:var(--muted)}
.up{color:var(--ok);font-weight:600}.down{color:var(--bad);font-weight:600}

/* chart */
.chart{padding:4px 12px 12px;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart .hit{fill:transparent;cursor:pointer}
.chart .val{fill:var(--ink);font-weight:700;font-size:10.5px}
.chart rect.sel{fill:var(--accent)}
.readout{padding:0 16px 2px;font-size:14px;color:var(--muted);min-height:22px}
.readout b{color:var(--ink);font-family:var(--mono)}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}

/* attention */
.att{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}
.att button{all:unset;cursor:pointer;display:inline-flex;gap:8px;align-items:center;padding:7px 11px;border-radius:10px;font-size:13.5px;background:var(--warn-soft);color:var(--warn)}
.att button.bad{background:var(--bad-soft);color:var(--bad)}
.att button b{font-weight:700}
.att .none{color:var(--muted);font-size:14px}

/* machines + day */
.split{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:900px){.split{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}.split .left{border-right:1px solid var(--line)}}
.mlist{list-style:none;margin:0;padding:0 8px 10px;display:flex;flex-direction:column;gap:2px}
.mrow{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px}
.mrow:hover{background:var(--surface-2)}
.mrow[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.mrow:focus-visible{outline:2px solid var(--accent)}
.st{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.st.warn{background:var(--warn)}.st.bad{background:var(--bad)}.st.all{background:var(--accent);border-radius:2px}
.mrow .t{display:flex;flex-direction:column;min-width:0}
.mrow .n{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .loc{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.mrow .r .num{font-weight:700;font-size:14px}
.mrow .r small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.mrow .r small.warn{color:var(--warn)}.mrow .r small.bad{color:var(--bad)}
.type{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}

.day{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.dayh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;padding-top:14px}
.dayh h3{margin:0;font-size:16px;font-weight:700}
.dayh p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.nav{display:inline-flex;align-items:center;gap:4px}
.nav button{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:8px;font-weight:700}
.nav button:disabled{opacity:.35;cursor:default}
.nav span{min-width:104px;text-align:center;font-weight:600;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--mono);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.hours{display:flex;flex-direction:column;gap:4px}
.hbars{display:flex;align-items:flex-end;gap:2px;height:64px}
.hbars button{all:unset;cursor:pointer;flex:1 1 0;height:100%;display:flex;align-items:flex-end}
.hbars button span{display:block;width:100%;border-radius:2px 2px 0 0;background:var(--bar)}
.hbars button[aria-pressed="true"] span{background:var(--accent)}
.hbars button:focus-visible{outline:2px solid var(--accent)}
.hlab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted)}
.hread{font-size:13px;color:var(--muted);min-height:20px}
.hread b{color:var(--ink);font-family:var(--mono)}
.gchips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.gchips::-webkit-scrollbar{display:none}
.gchips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.gchips button span{color:var(--muted);font-weight:500;font-family:var(--mono);font-size:11.5px}
.gchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gchips button[aria-pressed="true"] span{color:inherit;opacity:.8}
.mpick{display:none}
.ptrig{width:100%;display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);text-align:left}
.ptrig[aria-expanded="true"]{border-color:var(--accent);border-bottom-left-radius:0;border-bottom-right-radius:0}
.pn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptrig .num{font-weight:700}
.chev{color:var(--muted)}
.pdrop{border:1px solid var(--accent);border-top:0;border-radius:0 0 12px 12px;background:var(--surface);padding-top:10px}
.pdrop .gchips{padding:0 10px 8px}
.plist2{list-style:none;margin:0;padding:0 6px 6px;max-height:55vh;overflow-y:auto}
.plist2 button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 8px;border-radius:9px}
.plist2 button[aria-pressed="true"]{background:var(--accent-soft)}
.plist2 button:focus-visible{outline:2px solid var(--accent)}
.plist2 .num{font-weight:700;font-size:14px}
@media (max-width:899px){.split .left{display:none}.mpick{display:block}.day{padding-top:14px}}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.share{height:4px;border-radius:2px;background:var(--accent);margin-top:4px;opacity:.55}
.pay{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pay.cash{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tblwrap{overflow-x:auto;max-height:420px;overflow-y:auto}
.mrow .r small .up,.mrow .r small .down{font-weight:700}
.card{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rf{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 9px;font-size:12.5px;font-weight:600;color:var(--bad)}
.rf:hover{background:var(--bad-soft)}
tr.refunded td{color:var(--muted)}
tr.refunded .nm{text-decoration:line-through}
.tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--bad-soft);color:var(--bad)}
.txnote{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:20px 0;text-align:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(8 12 18 / .45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:min(480px,100%);border-radius:16px 16px 0 0;border:1px solid var(--line);
  padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.sheet{border-radius:16px}}
.sheet h3{margin:0;font-family:var(--display);font-size:17px}
.sheet p{margin:0;color:var(--muted);font-size:14px}
.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;touch-action:none}
.blist li{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);position:relative}
.blist li.dragging{z-index:2;box-shadow:0 8px 24px rgb(0 0 0 / .18);border-color:var(--accent)}
.blist li.off .bn{color:var(--muted)}
.grip{cursor:grab;font-size:20px;line-height:1;color:var(--muted);padding:8px 6px;border-radius:6px;touch-action:none;user-select:none}
.blist li.dragging .grip{cursor:grabbing;color:var(--accent)}
.bn{flex:1;font-weight:600;font-size:14.5px}
.sw{position:relative;width:46px;height:28px;flex:0 0 auto;cursor:pointer}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .3);transition:transform .15s}
.sw input:checked + span{background:var(--accent)}
.sw input:checked + span::after{transform:translateX(18px)}
.sw input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.sw span,.sw span::after{transition:none}}
.row-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.glist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.glist li{display:flex;gap:6px}
.glist input{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-weight:600}
.gm{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:8px}
.gm label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.gm label span{display:flex;flex-direction:column;min-width:0}
.gm label b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm label small{font-size:12px;color:var(--muted)}
.gm select{max-width:48%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.login{max-width:440px;margin:24px auto;display:flex;flex-direction:column;gap:12px;padding:20px}
.login h2{margin:0;font-family:var(--display);font-size:18px}
.login p{margin:0;color:var(--muted);font-size:14px}
.login label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.login input{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:15px;color:var(--ink)}
.login .err{color:var(--bad);font-size:14px;font-weight:600}
.loading{padding:28px 20px;text-align:center;color:var(--muted)}
.bar2{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:12px auto 0;max-width:320px}
.bar2 span{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
</style>

</head><body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="fresh">Вендиста</div>
      <h1>Обзор</h1>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap" id="topBtns" hidden>
      <button class="btn" id="reload" type="button">Обновить</button>
      <button class="btn" id="cfg" type="button">Настроить экран</button>
      <button class="btn" id="logout" type="button">Выйти</button>
    </div>
  </header>
  <div id="blocks" class="wrap" style="max-width:none;margin:0"></div>
</div>
<div id="sheetRoot"></div>

<script>
(() => {
/* ---------- наш сервер (логины Вендисты хранятся на нём, не в телефоне) ---------- */
const LS={get(k){try{return JSON.parse(localStorage.getItem("vd."+k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem("vd."+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem("vd."+k)}catch(e){}}};
class NeedLogin extends Error{}
let me=null;
async function api(path,params,opt={}){
  const url="/api"+path+(params?"?"+new URLSearchParams(params):"");
  const r=await fetch(url,{method:opt.method||"GET",credentials:"same-origin",headers:opt.body?{"Content-Type":"application/json"}:{},body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===401&&path!=="/login")throw new NeedLogin();
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||("Ошибка "+r.status));
  return j;
}
const pad=n=>String(n).padStart(2,"0");

/* ---------- данные ---------- */
let M=[], RAW={}, now=new Date(), DAY0, loadedAt=null;
const DAYS=30;
function setNow(){now=new Date();DAY0=new Date(now.getFullYear(),now.getMonth(),now.getDate())}
setNow();
const dayDate=k=>new Date(DAY0.getTime()-k*864e5);
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function toItems(rows){
  const byM=new Map(M.map(m=>[m.vid,m]));
  const out=[];
  rows.forEach(r=>{const m=byM.get(r.machine_id);if(!m)return;const t=new Date(r.time),n=Math.max(1,+r.qty||1);
    for(let j=0;j<n;j++)out.push({id:r.id+"|"+j,t,name:r.name||("Кнопка "+r.button),price:r.price,cash:r.sell_type===1,pt:r.sell_type,card:null,layout:r.button,m})});
  return out;
}
let byDay={};
function index(){byDay={};Object.values(RAW).forEach(s=>{const k=s.m.id+"|"+dkey(s.t);(byDay[k]||(byDay[k]=[])).push(s)});
  Object.values(byDay).forEach(a=>a.sort((x,y)=>x.t-y.t))}
function sales(m,k){return byDay[m.id+"|"+dkey(dayDate(k))]||[]}
function addSales(items){items.forEach(s=>RAW[s.id]=s)}
async function loadAll(progress){
  setNow();
  me=await api("/me");
  const ms=await api("/machines");
  M=ms.map(v=>({vid:v.id,id:"V"+v.id,name:v.name,model:v.model,loc:v.division||v.address,addr:v.address,terminal_id:v.terminal_id,
    type:/кофе|coffee|kikko|opera|concerto|maestro|necta|bianchi/i.test(v.model+" "+v.name)?"coffee":"snack",
    state:v.state,last_sale:v.last_sale?new Date(v.last_sale):null,last_online:v.last_online?new Date(v.last_online):null}));
  RAW={};
  // 30 дней кусками по 10 дней, чтобы видеть прогресс
  const parts=[[29,20],[19,10],[9,0]];let done=0;
  for(const [a,b] of parts){
    const from=dayDate(a), to=b===0?new Date():dayDate(b-1);
    addSales(toItems(await api("/sales",{from:from.toISOString(),to:to.toISOString()})));
    progress&&progress(++done,parts.length);
  }
  index();loadedAt=new Date();
}
async function refreshToday(){
  setNow();
  const ms=await api("/machines");
  ms.forEach(v=>{const m=M.find(x=>x.vid===v.id);if(m){m.state=v.state;m.last_sale=v.last_sale?new Date(v.last_sale):null;m.last_online=v.last_online?new Date(v.last_online):null}});
  Object.keys(RAW).forEach(k=>{if(RAW[k].t>=DAY0)delete RAW[k]});
  addSales(toItems(await api("/sales",{from:DAY0.toISOString(),to:new Date().toISOString()})));
  txCache={};index();loadedAt=new Date();
}
/* транзакции по карте (для возвратов) — грузятся по дню при открытии вкладки */
let txCache={};
async function loadTx(k){
  const key=dkey(dayDate(k)); if(txCache[key]&&txCache[key]!=="loading")return;
  txCache[key]="loading";
  try{const to=k===0?new Date():dayDate(k-1);txCache[key]=await api("/transactions",{from:dayDate(k).toISOString(),to:to.toISOString()})}
  catch(e){txCache[key]={error:e.message}}
  if(prefs.view==="tx"&&$("day"))$("day").innerHTML=dayPanel();
}
let refunds=new Set();

const live=a=>a.filter(s=>!refunds.has(s.id));
const sum=a=>a.reduce((x,s)=>x+(refunds.has(s.id)?0:s.price),0);
const nowMin=()=>now.getHours()*60+now.getMinutes();
function weekAgo(arr,k){return k===0?arr.filter(s=>s.t.getHours()*60+s.t.getMinutes()<=nowMin()):arr}
function delta(cur,prev){if(!prev)return null;return Math.round((cur/prev-1)*100)}
function dHtml(d){if(d===null)return "";return `<span class="${d>=0?"up":"down"}">${d>=0?"▲":"▼"} ${Math.abs(d)}%</span>`}
function dText(d){return d===null?"":(d>=0?" ▲":" ▼")+Math.abs(d)+"%"}
const rub=v=>v.toLocaleString("ru-RU")+" ₽";
const ago=t=>{const mi=Math.max(0,Math.round((now-t)/6e4));if(mi<60)return mi+" мин назад";const h=Math.floor(mi/60);return h<24?h+" ч назад":Math.floor(h/24)+" дн назад"};
function status(m){
  const s=sales(m,0); const last=s.length?s[s.length-1].t:m.last_sale;
  if(m.last_online&&now-m.last_online>30*6e4)return {cls:"bad",text:"нет связи "+ago(m.last_online).replace(" назад","")};
  if(m.state==="failed")return {cls:"bad",text:"не работает"};
  if(m.state==="warning")return {cls:"warn",text:"есть проблема"};
  const h=now.getHours();
  if(h>=9&&h<21&&last&&now-last>4*36e5)return {cls:"warn",text:"нет продаж "+ago(last).replace(" назад","")};
  return {cls:"",text:last?ago(last):"—"};
}

let chartDays=[];
function fmtV(v){return prefs.metric==="sum"?rub(v):v+" шт."}
function dayLabel(d){return d.toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long"})}
function blockChart(){
  const R=prefs.range; chartDays=[];
  for(let k=R-1;k>=0;k--){const a=allSales(k);chartDays.push({k,d:dayDate(k),v:prefs.metric==="sum"?sum(a):a.length})}
  const cw=Math.min(1200,document.documentElement.clientWidth)-60;
  const W=Math.max(300,Math.round(cw)),H=W<600?180:210,pl=34,pb=20,pt=R===7?18:8;
  const max=Math.max(...chartDays.map(x=>x.v))*1.08||1;
  const step=Math.pow(10,Math.floor(Math.log10(max/4))), tick=Math.ceil(max/4/step)*step;
  const bw=(W-pl-4)/R;
  const short=v=>prefs.metric==="sum"?(v>=1000?(v/1000).toFixed(v>=10000?0:1).replace(".",",")+"к":v):v;
  let g="";for(let v=0;v<=max;v+=tick){const y=H-pb-(v/max)*(H-pb-pt);
    g+=`<line class="grid" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pl-5}" y="${y+3}" text-anchor="end">${short(v)}</text>`}
  const every=R<=14?1:3;
  const bars=chartDays.map((x,i)=>{const h=(x.v/max)*(H-pb-pt),xx=pl+i*bw+bw*.15,w=bw*.7;
    const lab=i%every===0||x.k===0?`<text x="${xx+w/2}" y="${H-5}" text-anchor="middle">${x.d.getDate()}</text>`:"";
    const val=R===7?`<text class="val" x="${xx+w/2}" y="${H-pb-h-5}" text-anchor="middle">${short(x.v)}</text>`:"";
    return `<rect data-bar="${i}" x="${xx}" y="${H-pb-h}" width="${w}" height="${Math.max(h,1)}" rx="3" fill="var(${x.k===0?"--bar-today":"--bar"})"/>${val}${lab}<rect class="hit" data-ci="${i}" x="${pl+i*bw}" y="0" width="${bw}" height="${H}"><title>${dayLabel(x.d)}: ${fmtV(x.v)}</title></rect>`}).join("");

}

document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t)return;
  if(t.dataset.metric){prefs.metric=t.dataset.metric;savePrefs();render();return}
  if(t.dataset.range){prefs.range=+t.dataset.range;savePrefs();render();return}
  if(t.dataset.view){prefs.view=t.dataset.view;savePrefs();$("day").innerHTML=dayPanel();return}
  if(t.dataset.day){prefs.dayK=Math.max(0,Math.min(29,prefs.dayK+ +t.dataset.day));savePrefs();$("day").innerHTML=dayPanel();return}
  if(t.dataset.sel){prefs.sel=t.dataset.sel;pickerOpen=false;prefs.view="summary";
    if(t.dataset.sel!=="all"&&!gMachines().some(m=>m.id===t.dataset.sel))prefs.group="all";
    savePrefs();
    if(prefs.hidden.includes("machines")){prefs.hidden=prefs.hidden.filter(x=>x!=="machines")}
    render();
    if(window.innerWidth<900||t.closest(".att"))$("day")?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
    return}
  if(t.id==="cfg"){openCfg();return}
  if(t.dataset.hour!==undefined){document.querySelectorAll("[data-hour]").forEach(b=>b.setAttribute("aria-pressed",b===t));
    const h=+t.dataset.hour;$("hread").innerHTML=`${h}:00–${h+1}:00 · <b>${rub(+t.dataset.hv)}</b> · ${t.dataset.hn} шт.`;return}
});
document.addEventListener("click",e=>{
  const hit=e.target.closest("[data-ci]"); if(!hit)return;
  const i=+hit.dataset.ci, x=chartDays[i];
  document.querySelectorAll("[data-bar]").forEach(r=>r.classList.toggle("sel",+r.dataset.bar===i));
  $("readout").innerHTML=`${dayLabel(x.d)}: <b>${fmtV(x.v)}</b>`;
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-refund]"); if(!b)return;
  const list=txCache[b.dataset.tkey]; const t=Array.isArray(list)&&list.find(x=>String(x.id)===b.dataset.refund); if(!t)return;
  const mm=M.find(x=>x.terminal_id===t.terminal_id);
  const names=t.items.map(i=>i.name||"кнопка "+i.button).join(", ")||"—";
  $("sheetRoot").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">
    <h3>Вернуть ${t.sum} ₽?</h3>
    <p>${esc(names)} · ${new Date(t.time).toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})} · карта ${esc(t.card)}<br>${mm?esc(mm.name):""}</p>
    <p>Деньги вернутся на карту покупателя. Отменить возврат будет нельзя.</p>
    <div class="row-btns"><button type="button" class="btn" id="rfNo">Не возвращать</button><button type="button" class="btn primary" id="rfYes" style="background:var(--bad);border-color:var(--bad);color:#fff">Вернуть ${t.sum} ₽</button></div></div></div>`;
  const close=()=>{$("sheetRoot").innerHTML=""};
  $("scrim").addEventListener("click",ev=>{if(ev.target.id==="scrim")close()});
  $("rfNo").onclick=close;
  $("rfYes").onclick=async()=>{const y=$("rfYes");y.disabled=true;y.textContent="Возвращаю…";
    try{await api("/refund",null,{method:"POST",body:{id:t.id,sum:t.sum,confirm:true}});close();toast(`Возврат ${t.sum} ₽ отправлен в Вендисту`);
      txCache={};await refreshToday().catch(()=>{});stamp();render()}
    catch(err){y.disabled=false;y.textContent=`Вернуть ${t.sum} ₽`;toast("Возврат не прошёл: "+err.message)}};
  $("rfNo").focus();
});
let tt;function toast(msg){clearTimeout(tt);let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;tt=setTimeout(()=>t.remove(),3500)}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-group]");
  if(g){prefs.group=g.dataset.group;prefs.sel="all";prefs.view="summary";savePrefs();
    if(e.target.closest(".pdrop")){pickerOpen=true;render();}
    else render();
    return}
  if(e.target.closest("#ptrig")){pickerOpen=!pickerOpen;$("mpick").innerHTML=pickerHtml();return}
});
let lastW=document.documentElement.clientWidth,rt;
window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{const w=document.documentElement.clientWidth;if(Math.abs(w-lastW)>40){lastW=w;render()}},200)});

function openCfg(){
  const draw=()=>`<h3>Настроить экран</h3><p>Перетащите блок за ⠿, чтобы поменять порядок. Переключатель скрывает или показывает блок.</p>
    <ul class="blist" id="blist">${prefs.order.map(b=>`<li data-b="${b}" class="${prefs.hidden.includes(b)?"off":""}">
      <span class="grip" tabindex="0" role="button" aria-label="Переместить: ${BLOCKS[b]}. Стрелки вверх и вниз">⠿</span>
      <span class="bn">${BLOCKS[b]}</span>
      <label class="sw"><input type="checkbox" id="cb-${b}" data-tog="${b}" ${prefs.hidden.includes(b)?"":"checked"} aria-label="Показывать: ${BLOCKS[b]}"><span></span></label></li>`).join("")}</ul>
    <div class="row-btns"><button type="button" class="btn" id="toGroups">Группы автоматов</button><button type="button" class="btn primary" id="done">Готово</button></div>`;
  $("sheetRoot").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${draw()}</div></div>`;
  const sheet=$("sheetRoot").querySelector(".sheet");
  const close=()=>{$("sheetRoot").innerHTML="";render()};
  const commit=()=>{prefs.order=[...sheet.querySelectorAll("#blist li")].map(li=>li.dataset.b);savePrefs();render()};
  $("scrim").addEventListener("click",e=>{if(e.target.id==="scrim")close()});
  sheet.addEventListener("click",e=>{if(e.target.id==="done")close();if(e.target.id==="toGroups")openGroups()});
  sheet.addEventListener("change",e=>{const b=e.target.dataset.tog;if(!b)return;
    prefs.hidden=e.target.checked?prefs.hidden.filter(x=>x!==b):[...prefs.hidden,b];
    e.target.closest("li").classList.toggle("off",!e.target.checked);savePrefs();render()});
  // drag to reorder
  let drag=null;
  sheet.addEventListener("pointerdown",e=>{
    const g=e.target.closest(".grip"); if(!g)return; e.preventDefault();
    const li=g.closest("li"), list=li.parentElement, r=li.getBoundingClientRect();
    drag={li,list,startY:e.clientY,offset:e.clientY-r.top,h:r.height};
    li.classList.add("dragging"); g.setPointerCapture(e.pointerId);
  });
  sheet.addEventListener("pointermove",e=>{
    if(!drag)return;
    const {li,list}=drag;
    const sibs=[...list.children].filter(x=>x!==li);
    let before=null;
    for(const x of sibs){const rr=x.getBoundingClientRect();if(e.clientY<rr.top+rr.height/2){before=x;break}}
    if(before!==li.nextElementSibling) list.insertBefore(li,before);
    li.style.transform="";
    const natural=li.getBoundingClientRect().top;
    li.style.transform=`translateY(${e.clientY-drag.offset-natural}px)`;
  });
  const end=()=>{if(!drag)return;drag.li.style.transform="";drag.li.classList.remove("dragging");drag=null;commit()};
  sheet.addEventListener("pointerup",end);sheet.addEventListener("pointercancel",end);
  sheet.addEventListener("keydown",e=>{
    const g=e.target.closest(".grip"); if(!g||(e.key!=="ArrowUp"&&e.key!=="ArrowDown"))return; e.preventDefault();
    const li=g.closest("li");
    if(e.key==="ArrowUp"&&li.previousElementSibling)li.parentElement.insertBefore(li,li.previousElementSibling);
    if(e.key==="ArrowDown"&&li.nextElementSibling)li.parentElement.insertBefore(li.nextElementSibling,li);
    g.focus();commit();
  });
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("scrim")){$("sheetRoot").innerHTML="";render()}});
function showLogin(msg){
  $("topBtns").hidden=true;
  $("blocks").innerHTML=`<form class="panel login" id="loginForm" autocomplete="on">
    <h2>Вход</h2>
    <p>Логин и пароль, которые вы задали при установке сервера.</p>
    <label for="f-user">Логин<input id="f-user" name="username" required autocomplete="username" autocapitalize="none"></label>
    <label for="f-pass">Пароль<input id="f-pass" name="password" type="password" required autocomplete="current-password"></label>
    ${msg?`<div class="err" role="alert">${esc(msg)}</div>`:""}
    <button class="btn primary" type="submit" id="f-go">Войти</button>
  </form>`;
  $("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("f-go").disabled=true;$("f-go").textContent="Вхожу…";
    try{await api("/login",null,{method:"POST",body:{login:$("f-user").value.trim(),password:$("f-pass").value}});boot()}
    catch(err){showLogin(err.message==="Failed to fetch"?"Нет связи с сервером. Проверьте интернет.":err.message)}});
}
async function boot(){
  $("blocks").innerHTML=`<div class="panel loading">Загружаю автоматы и продажи за ${DAYS} дней…<div class="bar2"><span id="prog"></span></div></div>`;
  try{await loadAll((d,n)=>{const p=$("prog");if(p)p.style.width=(d/n*100)+"%"});ready()}
  catch(e){if(e instanceof NeedLogin)showLogin();else $("blocks").innerHTML=`<div class="panel loading">Не удалось загрузить: ${esc(e.message)}<br><br><button class="btn" type="button" onclick="location.reload()">Попробовать снова</button></div>`}
}
function stamp(){$("fresh").textContent=(me&&me.test?"Тестовый режим · только чтение · ":"Вендиста · ")+"обновлено в "+loadedAt.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}
let timer;
function ready(){
  $("topBtns").hidden=false;
  if(prefs.sel!=="all"&&!M.some(m=>m.id===prefs.sel))prefs.sel="all";
  stamp();render();
  clearInterval(timer);timer=setInterval(async()=>{if(document.hidden)return;try{await refreshToday();stamp();render()}catch(e){}},180000);
}
$("reload").onclick=async()=>{txCache={};const b=$("reload");b.disabled=true;b.textContent="Обновляю…";
  try{await refreshToday();stamp();render()}catch(e){if(e instanceof NeedLogin)showLogin("Сессия истекла, войдите снова.");else toast("Не обновилось: "+e.message)}
  b.disabled=false;b.textContent="Обновить"};
$("logout").onclick=async()=>{try{await api("/logout",null,{method:"POST"})}catch(e){}clearInterval(timer);showLogin()};
document.addEventListener("visibilitychange",async()=>{if(!document.hidden&&loadedAt&&Date.now()-loadedAt>120000){try{await refreshToday();stamp();render()}catch(e){}}});
boot();
})();
</script>
